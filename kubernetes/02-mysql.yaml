apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodflow-mysql
  namespace: foodflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodflow-mysql
  template:
    metadata:
      labels:
        app: foodflow-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodflow-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: foodflow
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: foodflow-mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foodflow-mysql-pvc
  namespace: foodflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: foodflow-mysql
  namespace: foodflow
spec:
  selector:
    app: foodflow-mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
